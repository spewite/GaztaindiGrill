; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Default target = OTA over Ethernet. Use "-e usb" for the first flash.
default_envs = esp32doit-devkit-v1

; --- Common options shared by every environment ---
[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    Wire
    fastled/FastLED
    bblanchon/ArduinoJson@^7.0.4
    arduino-libraries/Ethernet@^2.0.2

; --- OTA over Ethernet (W5500): default upload target ---
; Sends the built firmware to the device's HTTP /update endpoint.
; $SOURCE is the built firmware.bin. Posted via upload_ota.py (stdlib urllib) instead
; of shelling out to curl: on Windows, whichever curl.exe happens to be first on PATH
; is not guaranteed, and a Cygwin build of it fails to read any file under .pio here.
[env:esp32doit-devkit-v1]
upload_protocol = custom
upload_command = "$PYTHONEXE" upload_ota.py "$SOURCE"

; --- USB flashing ---
; Use this for the FIRST flash of this firmware (the OTA endpoint does not exist
; on the device yet). After that, plain OTA works:  pio run -e usb -t upload
[env:usb]
upload_protocol = esptool
